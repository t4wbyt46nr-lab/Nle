<style>

body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 12px}
/* ---------- menu ---------- */
.menu{text-align:center;padding:18px 0 10px;position:relative}
.menu .ball{font-size:30px;display:inline-block;animation:quica 1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes quica{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.logo{margin:4px 0 2px}
.logo .dr{font-family:Impact,"Arial Black",system-ui,sans-serif;font-weight:900;font-style:italic;font-size:clamp(54px,18vw,92px);line-height:.95;letter-spacing:2px;color:#ffd23f;text-shadow:0 4px 0 #9a6b00,0 8px 0 #4a3300;margin:0}
.logo svg{width:min(100%,430px);display:block;margin:6px auto 0;shape-rendering:crispEdges;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(255,45,45,.35))}
.tag{color:var(--mut);font-size:14px;letter-spacing:3px;text-transform:uppercase;margin:12px 0 16px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.chips span{background:var(--panel);border:1px solid #2c3c33;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.menu .card{background:var(--panel);border-radius:18px;padding:16px;text-align:left;border:2px solid #223229}
.menu .card label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.go{width:100%;font-size:19px;padding:16px;background:#ffd23f;color:#2a1c00;box-shadow:0 5px 0 #9a6b00;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6b00}
.menu details{margin-top:12px;color:var(--mut);font-size:13px;text-align:left}
.menu summary{cursor:pointer;text-align:center;font-weight:700}
.menu details p{margin:8px 4px 0;line-height:1.5}

.panel{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2c3c33;background:#0e1511;color:var(--tx);font-size:16px;margin:4px 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;color:#06210f;background:var(--ok)}
button small{font-weight:600;opacity:.7}
button:disabled{opacity:.3;cursor:default}
button.alt{background:#2c3c33;color:var(--tx)}
button.alt.on{background:var(--ok);color:#06210f}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1;min-width:84px}
.money{display:flex;gap:8px}.money div{flex:1;padding:10px;border-radius:12px;background:#0e1511;border:2px solid transparent;text-align:center;font-size:13px}
.money b{font-size:22px;display:block}
.money .turn{border-color:var(--ok)}
.bid{font-size:15px;color:var(--mut);margin:6px 0}
.bid b{color:var(--tx)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.lines h3{margin:0 0 6px;font-size:14px}
h3 small{color:var(--mut);font-weight:600;font-size:11px}
.sl{display:flex;justify-content:space-between;padding:3px 6px;border-radius:6px;background:#0e1511;margin-bottom:3px;border-left:3px solid transparent}
.sl.e{color:#56685c}
.sl .cl{color:var(--mut);font-size:10px;margin-left:5px}
.pos{color:var(--mut);margin-right:6px;font-size:11px}
canvas{width:100%;border-radius:12px;background:#0b0f14;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.score{display:flex;justify-content:center;align-items:center;gap:14px;font-size:30px;font-weight:800;margin-bottom:8px}
.score span{font-size:14px;font-weight:600;color:var(--mut)}
.score i{font-style:normal;color:var(--mut)}
#min{text-align:center;font-weight:700}
#feed{font-size:14px;margin-top:8px;max-height:170px;overflow:auto}
#feed div{padding:3px 0;border-bottom:1px solid #223229}
#feed .goal{font-weight:700}
.mn{color:var(--mut);font-size:12px;margin-right:4px}
.mut{color:var(--mut)}
.st{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:6px;font-size:14px;margin:4px 0}
.st b:last-of-type{text-align:right}
.st em{grid-column:1/4;text-align:center;font-style:normal;font-size:11px;color:var(--mut);margin-top:-3px}
.bar{display:flex;height:7px;background:#0e1511;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}.ba{background:var(--a)}.bb{background:var(--b)}
.fin .big{font-size:24px;font-weight:800;text-align:center}
.fin .bid{text-align:center}
.A{color:var(--a)}.B{color:var(--b)}

/* ---------- faixa de vez ---------- */
.turnbar{border-radius:14px;padding:12px 14px;margin:10px 0;text-align:center;color:#fff;animation:pop .35s ease-out}
.turnbar.ta{background:linear-gradient(135deg,#1f6fd1,#4da3ff)}
.turnbar.tb{background:linear-gradient(135deg,#c93a2e,#ff6b5e)}
.turnbar .t1{font-size:20px;font-weight:800;letter-spacing:.02em}
.turnbar .t2{font-size:14px;opacity:.92;margin-top:2px}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:8px 0;font-size:13px;min-height:26px}
.chip{padding:3px 9px;border-radius:99px;background:#0e1511;font-weight:700}
.chip.A{border:1px solid var(--a)}.chip.B{border:1px solid var(--b)}
.price{text-align:center;margin:4px 0 2px}
.price b{font-size:34px;font-weight:800}
.price span{display:block;font-size:13px;color:var(--mut)}
.nextinfo{background:#0e1511;border-radius:10px;padding:10px;text-align:center;font-size:14px;margin:10px 0}

.fc{position:relative;width:216px;height:286px;margin:12px auto;border-radius:20px;overflow:hidden;border:4px solid transparent;
 background:var(--bgp) padding-box,var(--bd) border-box;color:#fff;text-shadow:0 2px 5px #000b;isolation:isolate;
 box-shadow:0 10px 26px #0009,0 0 0 1px #0006}

.fc .top{left:12px;top:12px;text-align:center;background:#0006;border-radius:14px;padding:6px 9px 7px;min-width:58px;backdrop-filter:blur(2px)}
.fc .rt{font-size:42px;font-weight:900;line-height:1}
.fc .ps{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;opacity:.95}
.fc .em{margin:5px auto 0;display:block;font-size:10px;font-weight:900;letter-spacing:.06em;padding:2px 0;border-radius:6px;background:var(--ac);color:#111;text-shadow:none}
.fc .tr{right:12px;top:14px;text-align:right}
.fc .tr b{display:inline-block;font-size:10px;letter-spacing:.16em;font-weight:900;padding:3px 8px;border-radius:99px;background:#000a;border:1px solid #fff5}
.fc .tr div{margin-top:4px;font-size:14px;color:#ffd75a;letter-spacing:2px}
.fc .tr .frm{display:inline-block;font-size:13px;font-weight:900;letter-spacing:1px;color:#fff;background:#000b;border:1px solid #fff6;border-radius:6px;padding:2px 7px}

.fc .vr{margin-top:5px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ac);color:#111;text-shadow:none}

.fc .stamp.an{animation:stp .35s ease-out}
.fc .stamp small{display:block;font-size:13px;letter-spacing:.04em;color:#fff}

#feed .mega{background:linear-gradient(90deg,#3a2f0b,#0000);border-left:3px solid #f2c744;padding-left:6px;font-weight:700}

const left=p=>12-POSA.reduce((s,k)=>s+p.sl[k].length,0);
const free=(p,pos)=>cap(p,pos)-p.sl[pos].length>0;
const maxBid=p=>p.money-(left(p)-1); // sempre sobra 1 pila para cada vaga restante
const full=()=>G.P.every(p=>left(p)===0);
const ovr=p=>{const a=POSL.flatMap(k=>p.sl[k]);return a.length?Math.round(a.reduce((s,c)=>s+c.r,0)/a.length):'–'};
function needed(){
 if(G.wc){const p=G.P[0];if(!p.sl.COACH.length)return['COACH'];const w=[];POSL.forEach(k=>{for(let i=0;i<cap(p,k)-p.sl[k].length;i++)w.push(k)});return w} // técnicos primeiro; depois os jogadores, de acordo com a formação de cada técnico
 if(G.P.some(q=>!q.sl.COACH.length))return['COACH'];
 const w=[];POSL.forEach(k=>G.P.forEach(q=>{for(let i=0;i<cap(q,k)-q.sl[k].length;i++)w.push(k)}));return w}
function drawCard(){
 const pos=pick(needed());
 let pool=POOL.filter(c=>c.pos===pos&&!used.has(c.n)); // um mesmo jogador não aparece em duas versões no draft
 if(!pool.length)pool=POOL.filter(c=>c.pos===pos);
 const alt=pool.filter(c=>c.n!==G.skip);if(alt.length)pool=alt;
 const wt=c=>(c.r>=90?.6:c.r>=85?1.4:c.pos==='COACH'?1:3)/Math.sqrt(c.nv);
 let r=Math.random()*pool.reduce((s,c)=>s+wt(c),0),c=pool[0];
 for(const x of pool){r-=wt(x);if(r<=0){c=x;break}}
 used.add(c.n);return{n:c.n,pos:c.pos,club:c.club,lab:c.lab,r:c.r,t:tierOf(c.r),form:c.pos==='COACH'?(COFORM[c.n]||'4-4-2'):undefined}}
function lockFor(ms){G.lock=Date.now()+ms;clearTimeout(lockT);lockT=setTimeout(()=>{if(G&&G.phase==='auction')render()},ms+30)}
const locked=()=>Date.now()<G.lock;
function start(){
 const a=($('na').value||'').trim()||'Jogador 1',b=($('nb').value||'').trim()||'Jogador 2';
 used=new Set();sim=null;
 G={phase:'auction',P:[a,b].map(n=>({n,money:50,sl:{GK:[],DEF:[],MID:[],ATT:[],COACH:[]}})),first:0,skip:null,hist:[],note:'',sold:null,pending:null,fresh:false,lock:0};
 prep();reveal()}
function prep(){ // sorteia a próxima carta, mas só mostra depois do botão "Próxima"
 if(full()){G.pending=null;return}
 const card=drawCard(),el=[0,1].filter(i=>free(G.P[i],card.pos));
 const opener=el.includes(G.first)?G.first:el[0];
 G.first=1-opener; // alterna a partir de quem abriu de verdade
 G.pending={card,el,opener}}
function reveal(){
 clearTimeout(G.auto);G.auto=null;
 if(!G.pending)return startSim();
 const {card,el,opener}=G.pending;
 G.card=card;G.el=el;G.turn=opener;G.price=0;G.leader=null;G.noBidPass=false;G.hist=[];G.sold=null;G.pending=null;G.fresh=true;
 G.note=el.length<2?`Só ${G.P[el[0]].n} tem vaga de ${POSN[card.pos]}`:'';
 lockFor(250);render()}
function next(){if(!G||G.phase!=='auction'||!G.sold||locked())return;reveal()}
function win(i,cost,why){
 const p=G.P[i];p.money-=cost;p.sl[G.card.pos].push({...G.card,cost});G.skip=null;
 G.sold={i,cost,card:G.card,why};G.sfresh=true;prep();lockFor(250);render()}
function nxt(){ // depois de um lance: passa a vez ou fecha a venda
 const o=1-G.turn;
 if(G.el.includes(o)&&maxBid(G.P[o])>G.price){G.turn=o;G.note='';lockFor(200);render()}
 else win(G.leader,G.price,!G.el.includes(o)?`${G.P[o].n} não tem vaga de ${POSN[G.card.pos]}`:`${G.P[o].n} não consegue cobrir (máx. ${maxBid(G.P[o])} 💰)`)}
function raise(n){
 if(!G||G.phase!=='auction'||G.sold||locked())return;
 const p=G.P[G.turn],np=Math.min(G.price+n,maxBid(p));
 if(np<=G.price)return;
 G.price=np;G.leader=G.turn;G.hist.push({i:G.turn,n:p.n,v:np});nxt()}
function pass(){
 if(!G||G.phase!=='auction'||G.sold||locked()||G.leader===G.turn)return;
 if(G.card.pos==='COACH'&&G.el.length<2&&G.leader===null)return; // o técnico que sobra é obrigatório
 const p=G.P[G.turn];
 if(G.leader!==null){win(G.leader,G.price,`${p.n} desistiu`);return}
 const o=1-G.turn;
 if(G.el.includes(o)&&!G.noBidPass){G.noBidPass=true;G.turn=o;G.note=`${p.n} passou`;lockFor(200);render();return}
 used.delete(G.card.n);G.skip=G.card.n;G.sold={none:true,card:G.card};G.sfresh=true;prep();lockFor(250);render()}

function wcDraw(){if(left(G.P[0])===0)return wcBuild();G.wc.card=drawCard();G.wc.fresh=true}
function wcTake(){const w=G.wc,c=w.card;if(!c)return;G.P[0].sl[c.pos].push({...c,cost:0});G.skip=null;wcDraw();render()}
function wcSkip(){const w=G.wc;if(!w.card||w.skips<=0)return;w.skips--;used.delete(w.card.n);G.skip=w.card.n;wcDraw();render()}
function wcBuild(){
 const p=G.P[0],un=new Set(POSA.flatMap(k=>p.sl[k]).map(c=>c.n)),nm=[...WCN].sort(()=>Math.random()-.5);
 G.wc.card=null;G.wc.opps=[0,1,2,3].map(i=>cpuTeam(nm[i],i,new Set(un)));G.phase='wcteam'}
function wcPlay(){G.P=[G.P[0],G.wc.opps[G.wc.round]];startSim()}
function wcNextRound(){G.wc.round++;G.P=[G.P[0]];G.phase='wcbracket';sim=null;render()}
function wcRetry(){champId++;startWC(G.P[0].n)}
function wcBtns(w,sc,pen){
 const r=G.wc.round,sty='<div class="row" style="margin-top:12px">';G.wc.res[r]={sc:[...sc],pen:pen?[...pen.sc]:null,win:w===0};
 if(w!==0)return `<div class="bid" style="text-align:center;font-size:18px">💀 Eliminado na ${WCR[r]}</div>${sty}<button onclick="wcRetry()">🔁 Tentar de novo</button><button class="alt" onclick="newDraft()">Menu</button></div>`;
 if(r===3)return `${sty}<button onclick="wcChamp()">🏆 LEVANTAR A TAÇA</button></div>`;
 return `${sty}<button onclick="wcNextRound()">▶ Próxima fase</button></div>`}
function wcBracketHTML(){
 const w=G.wc;return `<div class="panel">${WCR.map((nm,i)=>{const o=w.opps[i],rs=w.res[i],cur=i===w.round&&G.phase!=='wcteam'||(G.phase==='wcteam'&&i===0);
  const st=rs?(rs.win?'✅':'❌'):cur?'▶':'⏳',sc=rs?`<b>${rs.sc[0]} x ${rs.sc[1]}</b>${rs.pen?` <small>(pên. ${rs.pen[0]} x ${rs.pen[1]})</small>`:''}`:`<small>OVR ${ovr(o)}</small>`;
  return `<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid #223229;${cur?'color:#ffd23f;font-weight:800':''}"><span>${st} ${nm}</span><span>vs ${esc(o.n)} ${sc}</span></div>`}).join('')}</div>`}
function wcRender(){
 const A=$('app'),w=G.wc,p=G.P[0],h='<h1>🏆 Copa do Mundo</h1>',one='<div class="lines" style="grid-template-columns:1fr;margin-top:12px">'+line(p,0)+'</div>';
 if(G.phase==='wcdraft'){const c=w.card,fr=w.fresh;w.fresh=false;
  A.innerHTML=`${h}<div class="money"><div class="turn"><span class="A">${esc(p.n)}</span><b>${12-left(p)}/12</b>escolhidos · OVR ${ovr(p)}</div><div><span class="mut">Pulos</span><b>${w.skips} ⏭</b>restantes</div></div>
  ${cardHTML(c,{fresh:fr})}${c.pos==='COACH'?`<div class="bid" style="text-align:center;margin:0">🧥 Técnico define a formação: <b>${c.form}</b></div>`:''}
  <div class="row" style="margin-top:10px"><button onclick="wcTake()">✅ Puxar pro time</button><button class="alt" ${w.skips?'':'disabled'} onclick="wcSkip()">⏭ Pular <small>(${w.skips} restantes)</small></button></div>${one}`;return}
 if(G.phase==='wcteam'){A.innerHTML=`${h}<div class="bid" style="text-align:center;font-size:17px"><b>Seu time está pronto!</b> OVR ${ovr(p)} · ${formOf(p)}</div>${wcBracketHTML()}<button class="go" onclick="wcPlay()">▶ COMEÇAR A COPA</button>${one}`;return}
 if(G.phase==='wcbracket'){A.innerHTML=`${h}${wcBracketHTML()}<button class="go" onclick="wcPlay()">⚽ Jogar ${WCR[w.round]}</button>${one}`;return}}
/* ---------- animação de campeão do mundo ---------- */
let champId=0;
function wcChamp(){
 const p=G.P[0];G.phase='wcchamp';const id=++champId;
 $('app').innerHTML=`<div style="max-width:760px;margin:0 auto"><canvas id="cc" width="400" height="300" style="border-radius:14px"></canvas><div class="row" style="margin-top:12px"><button onclick="wcRetry()">🔁 Jogar outra Copa</button><button class="alt" onclick="newDraft()">Menu</button></div></div>`;
 if(document.fonts&&document.fonts.load)document.fonts.load('12px "Press Start 2P"');
 const cv=$('cc'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 const all=POSL.flatMap(k=>p.sl[k]).filter(c=>c.pos!=='GK'),cap0=all.slice().sort((a,b)=>b.r-a.r)[0],
  others=POSA.flatMap(k=>p.sl[k]).filter(c=>c!==cap0),
  stars=Array.from({length:45},(_,i)=>({x:(i*97)%400,y:(i*53)%150,p:i})),
  cf=Array.from({length:90},(_,i)=>({x:Math.random()*400,y:Math.random()*300,vy:30+Math.random()*50,ph:Math.random()*6,c:['#ffd24d','#fff','#4da3ff','#ff6b5e','#3ddc84'][i%5]})),
  fw=[],PAL=['#ffd24d','#fff','#ff6b5e','#4da3ff','#3ddc84','#ff9bd5'];
 let t0=performance.now(),last=t0,nf=0;
 const cup=(cx,cy)=>{ /* taça pixelada */
  g.fillStyle='#a27d00';g.fillRect(cx-11,cy-4,22,5);g.fillStyle='#1f9d55';g.fillRect(cx-11,cy-9,22,5);
  g.fillStyle='#f2c744';g.fillRect(cx-5,cy-22,10,13);g.fillRect(cx-8,cy-18,16,4);
  for(let y=-14;y<=14;y++){const w=Math.round(Math.sqrt(196-y*y));g.fillStyle='#ffd24d';g.fillRect(cx-w,cy-36+y,w*2,1)}
  g.fillStyle='#fff7c2';g.fillRect(cx-8,cy-44,4,10);g.fillRect(cx-6,cy-46,6,2);g.fillStyle='#c79a1a';g.fillRect(cx+4,cy-34,5,12);g.fillRect(cx-14,cy-37,28,1)};
 const spr=(c,pose,x,y,z)=>{const s=mkSpr(c,0,pose,0);g.drawImage(s,Math.round(x-7*z),Math.round(y-18*z),15*z,21*z)};
 function frame(now){
  if(id!==champId||!$('cc'))return;
  const T=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
  const gr=g.createLinearGradient(0,0,0,300);gr.addColorStop(0,'#070b1f');gr.addColorStop(.55,'#1b2a63');gr.addColorStop(1,'#35205a');g.fillStyle=gr;g.fillRect(0,0,400,300);
  stars.forEach(s=>{if(Math.sin(T*3+s.p)>-.2){g.fillStyle='#fff';g.fillRect(s.x,s.y,s.p%4?1:2,s.p%4?1:2)}});
  g.save();g.translate(200,150);g.globalAlpha=.15+.06*Math.sin(T*3);g.fillStyle='#ffd24d';
  for(let i=0;i<12;i++){const a=T*.45+i*Math.PI/6;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-.09)*340,Math.sin(a-.09)*340);g.lineTo(Math.cos(a+.09)*340,Math.sin(a+.09)*340);g.closePath();g.fill()}g.restore();g.globalAlpha=1;
  for(let x=0;x<400;x+=5){const h=(x*7)%5,by=Math.abs(Math.sin(T*5+x))*3;g.fillStyle=['#2b3a7a','#5a2a6a','#2a5a7a','#7a2a3a'][(x/5)%4|0];g.fillRect(x,232+h*5-by,4,40)}
  g.fillStyle='#17602f';g.fillRect(0,268,400,32);g.fillStyle='#1c6b37';for(let x=0;x<400;x+=40)g.fillRect(x,268,20,32);
  /* fogos */
  if(Math.random()<dt*2.2){const x=50+Math.random()*300,y=40+Math.random()*100,c=PAL[Math.random()*6|0];for(let k=0;k<34;k++){const a=k/34*6.283,v=40+Math.random()*50;fw.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.2,c})}}
  for(let i=fw.length-1;i>=0;i--){const f=fw[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=45*dt;f.l-=dt;if(f.l<=0){fw.splice(i,1);continue}g.globalAlpha=Math.min(1,f.l);g.fillStyle=f.c;g.fillRect(f.x|0,f.y|0,2,2)}g.globalAlpha=1;
  /* time comemorando + capitão com a taça */
  const jp=(k)=>-Math.abs(Math.sin(T*7+k))*9,ps=['cel0','cel1','cel2'];
  others.forEach((c,i)=>{const left=i<5,x=left?22+i*27:240+(i-5)*27;spr(c,ps[(Math.floor(T*4+i))%3],x,292+jp(i)*(1),2)});
  const cy=282+jp(0)*.6;spr(cap0,'cel0',200,cy,4);cup(200,cy-18*4+20);
  /* confete */
  cf.forEach(c=>{c.y+=c.vy*dt;if(c.y>300){c.y=-5;c.x=Math.random()*400}g.fillStyle=c.c;g.fillRect(Math.round(c.x+Math.sin(T*2+c.ph)*8),c.y|0,3,2)});
  /* título */
  g.fillStyle='#000a';g.fillRect(0,8,400,52);g.fillStyle='#ffd24d';g.fillRect(0,8,400,2);g.fillRect(0,58,400,2);
  const col=Math.floor(T*4)%2?'#ffd24d':'#fff';g.font='18px '+PF;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=5;g.strokeStyle='#000';
  const bump=T<.6?1+(.6-T)*1.5:1;g.save();g.translate(200,26);g.scale(bump,bump);g.strokeText('CAMPEÃO DO MUNDO!',0,0);g.fillStyle=col;g.fillText('CAMPEÃO DO MUNDO!',0,0);g.restore();
  g.font='11px '+PF;g.strokeText(p.n.toUpperCase().slice(0,18),200,46);g.fillStyle='#fff';g.fillText(p.n.toUpperCase().slice(0,18),200,46);
  if(T<.7){g.globalAlpha=1-T/.7;g.fillStyle='#fff';g.fillRect(0,0,400,300);g.globalAlpha=1}
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame)}

function loop(now,S){
 if(S!==sim||!$('cv'))return;
 const dt=Math.min(.05,(now-S.last)/1000);S.last=now;
 for(let k=0;k<S.speed;k++){tick(dt);move(dt)}
 draw();hud();
 if(S.fin)return;
 requestAnimationFrame(n=>loop(n,S))}
render();
</script></body></html>
